name: Create release for version tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, for example v7.2.4 or v7.2.0-rc1"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate tag input
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]*)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          prerelease_args=()
          if [[ "$TAG" =~ -(alpha|beta|rc)[0-9]*$ ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "VirtualBox upstream release $TAG" \
            "${prerelease_args[@]}"
